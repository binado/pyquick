[project]
name = "pyquick-template"
version = "0.1.0"
description = "Development environment for the pyquick Copier template"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9.18.2,<10",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.83",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.src]
include = ["tests"]
